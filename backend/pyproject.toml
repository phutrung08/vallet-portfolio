[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vallet-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "cryptography>=50.0,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
