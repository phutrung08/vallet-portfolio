name: Security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install runtime dependencies and pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --require-hashes -r requirements.lock
          pip install pip-audit

      - name: Audit Python runtime dependencies
        run: pip-audit --path .audit-venv/lib/python3.12/site-packages --local

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check npm dependency licenses
        run: |
          node -e '
          const lock = require("./package-lock.json");
          const allowedProd = new Set(["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "OFL-1.1", "0BSD", "Unlicense"]);
          const allowedDev = new Set([...allowedProd, "BlueOak-1.0.0", "CC-BY-4.0", "CC0-1.0", "MPL-2.0", "Python-2.0", "(MIT OR CC0-1.0)"]);
          const bad = [];
          for (const [pkg, meta] of Object.entries(lock.packages)) {
            if (!pkg) continue;
            const lic = meta.license || "UNKNOWN";
            const isBuildOnly = Boolean(meta.dev || meta.devOptional || pkg.startsWith("node_modules/lightningcss"));
            const ok = isBuildOnly ? allowedDev.has(lic) : allowedProd.has(lic);
            if (!ok) bad.push({ pkg, dev: isBuildOnly, license: lic });
          }
          if (bad.length > 0) {
            console.error("Disallowed licenses:", bad);
            process.exit(1);
          }
          console.log("License check passed.");
          '
